# ServiceAccount for least-privilege access
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-sa
  namespace: pokemission
---
# Role: least-privilege - only read secrets in own namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-role
  namespace: pokemission
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
    resourceNames: ["db-secret"]
---
# RoleBinding: bind app-sa to app-role
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-rolebinding
  namespace: pokemission
subjects:
  - kind: ServiceAccount
    name: app-sa
    namespace: pokemission
roleRef:
  kind: Role
  name: app-role
  apiGroup: rbac.authorization.k8s.io